<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排煙風量測試 (快速計算版)</title>
    <style>
        /* --- 全域設定 --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0; padding: 15px; background-color: #f0f2f5; color: #333; 
            padding-bottom: 100px; 
        }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 15px; color: #2c3e50; }

        /* --- 卡片區塊 --- */
        .card {
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px;
            border: 1px solid #e1e4e8;
        }
        .project-panel { background: #e3f2fd; border-color: #bbdefb; }
        
        /* --- 輸入欄位 --- */
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.95rem; }
        
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; appearance: none;
        }
        input:focus, select:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        
        /* 下拉選單箭頭優化 */
        select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right .7em top 50%; background-size: .65em auto; }

        /* 分隔線標題 */
        .section-title {
            border-left: 5px solid #007bff; padding-left: 10px; margin: 20px 0 10px 0; color: #007bff; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center;
        }

        /* 群組設定區塊特別樣式 */
        .group-input-box {
            background-color: #fff8e1; padding: 15px; border-radius: 8px; border: 1px solid #ffe082; margin-bottom: 15px;
        }

        .size-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .wind-inputs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .wind-inputs input { padding: 8px 2px; text-align: center; font-size: 14px; }
        
        /* --- 按鈕 --- */
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-print { background-color: #007bff; color: white; margin-bottom: 15px; }
        .btn-reset { background-color: #dc3545; color: white; width: auto; float: right; margin-bottom: 20px; padding: 8px 15px; font-size: 0.9rem;}

        /* --- 表格樣式 --- */
        .table-container { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 8px 5px; text-align: center; font-size: 0.9rem; vertical-align: middle; }
        th { background-color: #f8f9fa; color: #495057; white-space: nowrap; padding: 10px; }
        
        /* 結果樣式 */
        .status-pass { color: #155724; font-weight: bold; background-color: #d4edda; }
        .status-fail { color: #721c24; font-weight: bold; background-color: #f8d7da; }
        .group-tag { display: inline-block; background: #6c757d; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
        .single-tag { display: inline-block; background: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

        /* --- 總表樣式 --- */
        .summary-table { width: 100%; margin-top: 10px; border: 2px solid #333; }
        .summary-table th { background-color: #343a40; color: white; }
        .summary-table td { font-weight: bold; font-size: 1.1em; }

        /* --- 版權宣告樣式 (螢幕顯示) --- */
        .copyright {
            text-align: center; 
            margin-top: 20px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            color: #888; /* 螢幕上用灰色，比較不搶眼 */
            padding-bottom: 20px;
        }

        /* --- RWD --- */
        @media (max-width: 600px) {
            .size-inputs { grid-template-columns: 1fr; }
        }

        /* --- 列印模式 (去除頁首頁尾 + 隱藏版權) --- */
        @page { margin: 0; size: auto; }
        @media print {
            /* 隱藏區塊：卡片、按鈕、不列印區、以及【版權宣告】 */
            .card, .btn, .no-print, .copyright { display: none !important; }
            
            body { background-color: white; margin: 1.5cm; padding: 0; }
            .table-container { overflow: visible; }
            table { width: 100%; min-width: auto; border: 2px solid black; font-size: 9pt; page-break-inside: avoid; }
            th, td { border: 1px solid black; padding: 4px; color: black; }
            .section-title { border: none; padding: 0; color: black; font-weight: bold; margin-top: 20px;}
        }
    </style>
</head>
<body onload="initDate()">

    <h1>消防排煙風量測試報告</h1>

    <div class="card project-panel">
        <label>🏗️ 工程名稱 / 案名</label>
        <input type="text" id="projectInput" placeholder="例如：新建工程排煙測試" oninput="updateFooter()">
    </div>

    <div class="card">
        <h3 style="margin-top:0; color:#555;">➕ 新增測量數據</h3>
        
        <div class="group-input-box">
            <div class="form-group">
                <label>🏷️ 群組/區劃名稱 <span style="font-weight:normal; color:#d63384;">(★ 若為單口獨立，請留空)</span></label>
                <input type="text" id="groupName" list="groupSuggestions" placeholder="例如：1F大廳 (若為單口請勿填寫)">
                <datalist id="groupSuggestions"></datalist>
            </div>
            <div class="form-group">
                <label>🎯 該群組設計總風量 (CMM) 或 單口設計風量</label>
                <input type="number" id="designValue" inputmode="decimal" placeholder="例如：300">
            </div>
        </div>

        <div class="form-group">
            <label>閘門編號/位置 <span style="color:red">*</span></label>
            <input type="text" id="gateName" placeholder="例如：排煙口-01">
        </div>

        <div class="form-group size-inputs">
            <div>
                <label>寬度 (m) <span style="color:red">*</span></label>
                <select id="wSelect" onchange="updateDim('w')">
                    <option value="" disabled selected>請選擇</option>
                    <option value="0.4">0.4</option>
                    <option value="0.6">0.6</option>
                    <option value="0.8">0.8</option>
                    <option value="1.0">1.0</option>
                    <option value="custom" style="color:blue; font-weight:bold;">其他 (輸入)</option>
                </select>
                <input type="number" id="gateWidth" step="0.01" inputmode="decimal" placeholder="輸入寬度" style="display:none; margin-top:5px; border-color:#007bff;">
            </div>

            <div>
                <label>高度 (m) <span style="color:red">*</span></label>
                <select id="hSelect" onchange="updateDim('h')">
                    <option value="" disabled selected>請選擇</option>
                    <option value="0.4">0.4</option>
                    <option value="0.6">0.6</option>
                    <option value="0.8">0.8</option>
                    <option value="1.0">1.0</option>
                    <option value="custom" style="color:blue; font-weight:bold;">其他 (輸入)</option>
                </select>
                <input type="number" id="gateHeight" step="0.01" inputmode="decimal" placeholder="輸入高度" style="display:none; margin-top:5px; border-color:#007bff;">
            </div>
        </div>

        <div class="form-group">
            <label>5點風速 (m/s)</label>
            <div class="wind-inputs">
                <input type="number" id="v1" step="0.1" inputmode="decimal" placeholder="1">
                <input type="number" id="v2" step="0.1" inputmode="decimal" placeholder="2">
                <input type="number" id="v3" step="0.1" inputmode="decimal" placeholder="3">
                <input type="number" id="v4" step="0.1" inputmode="decimal" placeholder="4">
                <input type="number" id="v5" step="0.1" inputmode="decimal" placeholder="5">
            </div>
        </div>
        <button class="btn btn-add" onclick="addData()">加入列表</button>
    </div>

    <div style="overflow: hidden;">
        <button class="btn btn-print" onclick="window.print()">列印報表 / 存 PDF</button>
        <button class="btn btn-reset" onclick="clearTable()">清除所有資料</button>
    </div>

    <div id="singleSection" style="display:none;">
        <h3 class="section-title">👤 單口獨立檢討明細</h3>
        <div class="table-container">
            <table id="singleTable">
                <thead>
                    <tr>
                        <th>類別</th>
                        <th>閘門名稱</th>
                        <th>尺寸/面積</th>
                        <th>5點紀錄 (m/s)</th>
                        <th>平均風速</th>
                        <th>設計風量</th>
                        <th>實測CMM</th>
                        <th>判定結果</th>
                        <th class="no-print">刪除</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="groupSection" style="display:none;">
        <h3 class="section-title">👥 區劃合併檢討明細</h3>
        <div class="table-container">
            <table id="groupTable">
                <thead>
                    <tr>
                        <th>所屬群組</th>
                        <th>閘門名稱</th>
                        <th>尺寸/面積</th>
                        <th>5點紀錄</th>
                        <th>平均風速</th>
                        <th>實測CMM</th>
                        <th class="no-print">刪除</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h3 class="section-title">📊 各區劃合併檢討總表</h3>
        <div class="table-container">
            <table class="summary-table" id="summaryTable">
                <thead>
                    <tr>
                        <th>群組名稱</th>
                        <th>閘門數量</th>
                        <th>實測總風量 (CMM)</th>
                        <th>設計總風量 (CMM)</th>
                        <th>判定結果</th>
                        <th>差額</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div style="margin-top:30px; border-top:1px solid #000; padding-top:10px; display:flex; justify-content:space-between;">
        <span>工程名稱：<span id="footerProjectName">尚未輸入</span></span>
        <span>測試日期：<span id="footerDate"></span></span>
    </div>

    <div class="copyright">
        版權所有Ⓒ巨祥科技有限公司
    </div>

    <script>
        let allData = [];

        function initDate() {
            const today = new Date();
            const dateStr = `${today.getFullYear()}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
            document.getElementById('footerDate').innerText = dateStr;
        }

        function updateFooter() {
            const val = document.getElementById('projectInput').value;
            document.getElementById('footerProjectName').innerText = val || "尚未輸入";
        }

        // 雙選單控制
        function updateDim(type) {
            const selectId = type === 'w' ? 'wSelect' : 'hSelect';
            const inputId = type === 'w' ? 'gateWidth' : 'gateHeight';
            
            const selectVal = document.getElementById(selectId).value;
            const inputEl = document.getElementById(inputId);

            if (selectVal === 'custom') {
                inputEl.style.display = 'block';
                inputEl.value = ''; 
                inputEl.focus();
            } else {
                inputEl.style.display = 'none';
                inputEl.value = selectVal;
            }
        }

        function addData() {
            try {
                const groupInput = document.getElementById('groupName').value.trim();
                const designValue = parseFloat(document.getElementById('designValue').value);
                const name = document.getElementById('gateName').value.trim();
                const w = parseFloat(document.getElementById('gateWidth').value);
                const h = parseFloat(document.getElementById('gateHeight').value);
                
                const v1 = parseFloat(document.getElementById('v1').value)||0; 
                const v2 = parseFloat(document.getElementById('v2').value)||0;
                const v3 = parseFloat(document.getElementById('v3').value)||0; 
                const v4 = parseFloat(document.getElementById('v4').value)||0;
                const v5 = parseFloat(document.getElementById('v5').value)||0;

                if (!name) { alert("請輸入閘門名稱！"); return; }
                if (isNaN(w)) { alert("請選擇或輸入「寬度」！"); return; }
                if (isNaN(h)) { alert("請選擇或輸入「高度」！"); return; }

                const isSingle = (groupInput === ""); 
                const groupName = isSingle ? "單口獨立" : groupInput;

                const area = w * h;
                const avgSpeed = (v1+v2+v3+v4+v5)/5;
                const cmm = area * avgSpeed * 60;

                const record = {
                    id: Date.now(),
                    isSingle: isSingle, 
                    group: groupName,
                    design: isNaN(designValue) ? 0 : designValue,
                    name: name,
                    sizeStr: `${w} x ${h}`,
                    area: area,
                    speeds: `${v1},${v2},${v3},${v4},${v5}`,
                    avg: avgSpeed,
                    cmm: cmm
                };

                allData.push(record);
                renderAll();
                
                if (!isSingle) {
                    updateGroupSuggestions(groupName); 
                    clearInputs(false); 
                } else {
                    clearInputs(true); 
                }

            } catch (e) {
                alert("錯誤：" + e.message);
            }
        }

        function renderAll() {
            renderSingleTable();
            renderGroupTables();
        }

        function renderSingleTable() {
            const tbody = document.querySelector("#singleTable tbody");
            const section = document.getElementById("singleSection");
            tbody.innerHTML = "";

            const singles = allData.filter(item => item.isSingle);

            if (singles.length === 0) {
                section.style.display = "none";
                return;
            }
            section.style.display = "block";

            singles.forEach(item => {
                let statusHtml = "-";
                let statusClass = "";

                if (item.design > 0) {
                    if (item.cmm >= item.design) {
                        statusHtml = "✅ 通過";
                        statusClass = "status-pass";
                    } else {
                        statusHtml = "❌ 不通過";
                        statusClass = "status-fail";
                    }
                } else {
                    statusHtml = "未指定";
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><span class="single-tag">單口</span></td>
                    <td style="text-align:left;">${item.name}</td>
                    <td>${item.sizeStr}<br><span style="color:#666;font-size:0.8em">(${item.area.toFixed(2)}m²)</span></td>
                    <td style="font-size:0.8em;color:#555;">${item.speeds}</td>
                    <td>${item.avg.toFixed(2)}</td>
                    <td>${item.design > 0 ? item.design : '-'}</td>
                    <td style="color:#0056b3; font-weight:bold;">${item.cmm.toFixed(2)}</td>
                    <td class="${statusClass}">${statusHtml}</td>
                    <td class="no-print"><button onclick="deleteData(${item.id})" style="color:red;border:1px solid red;background:none;border-radius:4px;cursor:pointer;">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderGroupTables() {
            const detailTbody = document.querySelector("#groupTable tbody");
            const summaryTbody = document.querySelector("#summaryTable tbody");
            const section = document.getElementById("groupSection");
            
            detailTbody.innerHTML = "";
            summaryTbody.innerHTML = "";

            const groupsData = allData.filter(item => !item.isSingle);

            if (groupsData.length === 0) {
                section.style.display = "none";
                return;
            }
            section.style.display = "block";

            groupsData.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><span class="group-tag">${item.group}</span></td>
                    <td style="text-align:left;">${item.name}</td>
                    <td>${item.sizeStr}<br><span style="color:#666;font-size:0.8em">(${item.area.toFixed(2)}m²)</span></td>
                    <td style="font-size:0.8em;color:#555;">${item.speeds}</td>
                    <td>${item.avg.toFixed(2)}</td>
                    <td style="color:#0056b3;">${item.cmm.toFixed(2)}</td>
                    <td class="no-print"><button onclick="deleteData(${item.id})" style="color:red;border:1px solid red;background:none;border-radius:4px;cursor:pointer;">✕</button></td>
                `;
                detailTbody.appendChild(tr);
            });

            let groupsSummary = {};
            groupsData.forEach(item => {
                if (!groupsSummary[item.group]) {
                    groupsSummary[item.group] = {
                        count: 0,
                        totalCMM: 0,
                        design: item.design 
                    };
                }
                if (item.design > 0) groupsSummary[item.group].design = item.design;
                
                groupsSummary[item.group].count++;
                groupsSummary[item.group].totalCMM += item.cmm;
            });

            for (let gName in groupsSummary) {
                const g = groupsSummary[gName];
                const tr = document.createElement("tr");
                
                let resultHtml = "-";
                let resultClass = "";
                let diffHtml = "-";

                if (g.design > 0) {
                    const diff = g.totalCMM - g.design;
                    if (diff >= 0) {
                        resultHtml = "✅ 合格";
                        resultClass = "status-pass";
                        diffHtml = `<span style="color:green">+${diff.toFixed(1)}</span>`;
                    } else {
                        resultHtml = "❌ 不合格";
                        resultClass = "status-fail";
                        diffHtml = `<span style="color:red">${diff.toFixed(1)}</span>`;
                    }
                } else {
                    resultHtml = "未設目標";
                }

                tr.innerHTML = `
                    <td style="text-align:left; padding-left:15px;">${gName}</td>
                    <td>${g.count} 處</td>
                    <td style="color:#0056b3;">${g.totalCMM.toFixed(1)}</td>
                    <td>${g.design > 0 ? g.design : '-'}</td>
                    <td class="${resultClass}">${resultHtml}</td>
                    <td>${diffHtml}</td>
                `;
                summaryTbody.appendChild(tr);
            }
        }

        function deleteData(id) {
            allData = allData.filter(item => item.id !== id);
            renderAll();
        }

        function clearTable() {
            if(confirm("確定要清空所有資料嗎？")) {
                allData = [];
                renderAll();
            }
        }

        function updateGroupSuggestions(newGroup) {
            const list = document.getElementById('groupSuggestions');
            let exists = false;
            for (let i = 0; i < list.options.length; i++) {
                if (list.options[i].value === newGroup) exists = true;
            }
            if (!exists && newGroup) {
                const option = document.createElement('option');
                option.value = newGroup;
                list.appendChild(option);
            }
        }

        function clearInputs(clearGroupInfo) {
            document.getElementById('gateName').value = '';
            
            // 重置選單
            document.getElementById('wSelect').value = ''; 
            document.getElementById('hSelect').value = ''; 
            document.getElementById('gateWidth').style.display = 'none';
            document.getElementById('gateHeight').style.display = 'none';
            document.getElementById('gateWidth').value = '';
            document.getElementById('gateHeight').value = '';

            for(let i=1;i<=5;i++) document.getElementById('v'+i).value = '';
            
            if (clearGroupInfo) {
                document.getElementById('groupName').value = '';
                document.getElementById('designValue').value = '';
            }
            document.getElementById('gateName').focus();
        }
    </script>
</body>
</html>
